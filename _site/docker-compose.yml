services:
  jekyll:
    build: .
    working_dir: /srv/jekyll
    volumes:
      - ./:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    ports:
      - "4000:4000"
    environment:
      - JEKYLL_ENV=development
    command: bundle exec jekyll serve --host 0.0.0.0 --trace

volumes:
  bundle_cache:
