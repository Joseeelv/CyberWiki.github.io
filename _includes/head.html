<head>
    {% include meta.html %}
    <title>{{ site.title }}</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon"
    href="{% if site.favicon-url %}{{ site.favicon-url }}{% else %}{{ 'assets/images/favicon.png' | absolute_url }}{% endif %}"
    type="image/x-icon">
    <!-- Font Awesome Icons (latest official version only) -->
    <script src="https://kit.fontawesome.com/6a97161b76.js" crossorigin="anonymous"></script>
    
    <!-- Main styles -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- Prism.js code highlighting -->
    <link rel="stylesheet" href="prism.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">


    <!-- Meta responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Navbar Style-->
    <link rel="stylesheet" href="/assets/css/navbar.css">

    <!-- 404 Style-->
    <link rel="stylesheet" href="/assets/css/404.css">

    <!-- Blog Style-->
    <link rel="stylesheet" href="/assets/css/blog.css">

    <!-- Page Style-->
    <link rel="stylesheet" href="/assets/css/page.css">

    <!-- Post Style-->
    <link rel="stylesheet" href="/assets/css/post.css">

    <!-- Search Style-->
    <link rel="stylesheet" href="/assets/css/search.css">

    <!-- About Style-->
    <link rel="stylesheet" href="/assets/css/about.css">

</head>
