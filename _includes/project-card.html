<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/projects.css">
</head>
<body>
  

</html>
<div class="projects-grid">
  {% for project in site.data.projects %}
  <div class="project-card">
    <a href="{{project.link}}" target="_blank" class="project-card-link">
      <figure class="project-card-image" style="background-image: url('{{ project.image }}');"></figure>
      <div class="project-card-content">
        <h1 class="project-card-title">{{ project.name }}</h1>
        <p class="project-card-desc">{{ project.description | truncate: 80 }}</p>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
</body>
